name: Strong name key
description: >-
  Writes LiteBus.snk from the STRONG_NAME_KEY secret so the build signs the assemblies. The key is required, except
  on a pull request from a fork, which cannot read repository secrets and builds unsigned.

inputs:
  key:
    description: The base64-encoded strong name key (pass secrets.STRONG_NAME_KEY).
    required: false
    default: ''
  required:
    description: When 'true', a missing key fails even on a fork pull request (release builds).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Write LiteBus.snk
      shell: bash
      env:
        STRONG_NAME_KEY: ${{ inputs.key }}
        KEY_REQUIRED: ${{ inputs.required }}
        IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      run: |
        if [ -z "${STRONG_NAME_KEY}" ]; then
          if [ "${KEY_REQUIRED}" != "true" ] && [ "${IS_FORK_PULL_REQUEST}" = "true" ]; then
            echo "::warning::STRONG_NAME_KEY is not available to pull requests from forks; this build is unsigned."
            exit 0
          fi
          echo "::error::STRONG_NAME_KEY is required. Only pull requests from forks may build unsigned."
          exit 1
        fi
        echo "${STRONG_NAME_KEY}" | base64 --decode > LiteBus.snk
