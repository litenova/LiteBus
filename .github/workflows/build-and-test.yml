# Build & Test - mandatory CI gates
#
# Skip waiver policy:
#   - [Fact(Skip = ...)] is blocked by verify-no-fact-skips.sh on all branches except quarantine.
#   - Quarantine branch waives the gate until every hard-coded Fact skip is removed.
#   - Emulator-backed SkippableFact broker tests must not skip when Docker is available: TransportDocker and
#     TransportAzure set LITEBUS_CI_STRICT_TRANSPORT=true and verify TRX skipped counts. TransportLiveAzure is an
#     opt-in category that requires explicit cloud credentials.
#   - Full integration (PostgreSQL, AMQP, EF) requires Docker on ubuntu-latest runners.
name: Build & Test

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PACKAGE_VERSION: 7.0.0-ci.${{ github.run_number }}

on:
  push:
    branches: [ '**' ]
    paths:
      - 'LiteBus.slnx'
      - 'Changelog.md'
      - 'README.md'
      - 'assets/**'
      - 'benchmarks/**'
      - 'coverlet*.runsettings'
      - 'site/**'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'samples/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    # Version branches carry a release line until it merges, and a pre-release can be cut from one, so a pull
    # request into one has to clear the same gates a pull request into main does.
    branches: [ main, 'v[0-9]*' ]
    paths:
      - 'LiteBus.slnx'
      - 'Changelog.md'
      - 'README.md'
      - 'assets/**'
      - 'benchmarks/**'
      - 'coverlet*.runsettings'
      - 'site/**'
      - 'global.json'
      - 'dotnet-tools.json'
      - 'samples/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate Documentation
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1

      - name: Check Documentation Version Snapshots
        shell: pwsh
        run: |
          # Reports, rather than fails: a snapshot falls behind when a fix lands on the branch it tracks, which is work
          # on another branch. Blocking this one for it would stop unrelated changes from merging.
          $output = ./scripts/Test-VersionSnapshots.ps1 2>&1 | Out-String
          Write-Host $output

          if ($output -match 'differs from') {
            Write-Host "::warning::A documentation version snapshot has fallen behind the branch it tracks, so the published documentation for that line is stale. See the job log for the files and the command to fix it."
          }

          "## Documentation version snapshots", '```', $output.TrimEnd(), '```' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Validate Documentation Site
        working-directory: site
        run: |
          npm ci
          if ! npm audit --audit-level=high; then
            echo "::warning::npm audit (high) reported vulnerabilities. Continuing CI because documentation dependencies are best-effort validated here."
          fi
          npm run lint
          npm run typecheck
          npm run build

      - name: Restore Dependencies
        run: dotnet restore LiteBus.slnx --locked-mode

      - name: Verify Formatting
        # The analyzers already fail the build; this gate covers the whitespace rules in .editorconfig.
        run: dotnet format whitespace LiteBus.slnx --verify-no-changes --verbosity minimal

      - name: Audit NuGet Dependencies
        shell: bash
        run: |
          audit_output="$(dotnet list LiteBus.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "${audit_output}"
          if grep -qi "has the following vulnerable packages" <<< "${audit_output}"; then
            echo "::error::NuGet vulnerability audit found a vulnerable package."
            exit 1
          fi

      - name: Decode Strong Name Key
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
          IS_FORK_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "${STRONG_NAME_KEY}" ]; then
            if [ "${IS_FORK_PULL_REQUEST}" = "true" ]; then
              echo "::warning::STRONG_NAME_KEY is not available to pull requests from forks; this build is unsigned."
              exit 0
            fi
            echo "::error::STRONG_NAME_KEY is required. Only pull requests from forks may build unsigned."
            exit 1
          fi
          echo "${STRONG_NAME_KEY}" | base64 --decode > LiteBus.snk

      - name: Build
        run: dotnet build LiteBus.slnx --configuration Release --no-restore /p:Version=${{ env.CI_PACKAGE_VERSION }} /p:ContinuousIntegrationBuild=true

      - name: Validate Documentation Semantics
        shell: pwsh
        run: ./scripts/Test-DocumentationSemantics.ps1 -Configuration Release

      - name: Verify Benchmark Discovery
        run: dotnet run --project benchmarks/LiteBus.Processor.Benchmarks --configuration Release --no-build -- --list flat

      - name: Fail on [Fact(Skip = ...)] in test projects
        run: bash .github/scripts/verify-no-fact-skips.sh "${{ github.workspace }}"

      - name: Require Docker for integration suites
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is required for TransportDocker, TransportAzure, and full integration tests on CI."
            exit 1
          fi
          echo "Docker is available."

      - name: Unit Tests
        run: |
          mkdir -p artifacts/coverage && echo unit >> artifacts/coverage/expected.txt
          dotnet test LiteBus.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory artifacts/coverage/unit --filter "FullyQualifiedName!~IntegrationTests"

      - name: Transport Fast Integration Tests
        run: |
          mkdir -p artifacts/coverage && echo transport-fast >> artifacts/coverage/expected.txt
          dotnet test tests/LiteBus.Durable.IntegrationTests --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory artifacts/coverage/transport-fast --filter "Category=TransportFast"

      - name: Transport Docker Integration Tests
        env:
          LITEBUS_CI_STRICT_TRANSPORT: 'true'
        run: |
          trx_dir="${RUNNER_TEMP}/transport-docker"
          mkdir -p "${trx_dir}" artifacts/coverage
          echo transport-docker-durable >> artifacts/coverage/expected.txt && echo transport-docker-wire >> artifacts/coverage/expected.txt
          dotnet test tests/LiteBus.Durable.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage/transport-docker-durable \
            --filter "Category=TransportDocker" \
            --logger "trx;LogFileName=${trx_dir}/durable-transport-docker.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/durable-transport-docker.trx"
          dotnet test tests/LiteBus.Transport.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage/transport-docker-wire \
            --filter "Category=TransportDocker" \
            --logger "trx;LogFileName=${trx_dir}/transport-wire-docker.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/transport-wire-docker.trx"

      - name: Transport Azure Integration Tests
        env:
          LITEBUS_CI_STRICT_TRANSPORT: 'true'
        run: |
          trx_dir="${RUNNER_TEMP}/transport-azure"
          mkdir -p "${trx_dir}" artifacts/coverage
          echo transport-azure >> artifacts/coverage/expected.txt
          dotnet test tests/LiteBus.Durable.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage/transport-azure \
            --filter "Category=TransportAzure" \
            --logger "trx;LogFileName=${trx_dir}/transport-azure.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/transport-azure.trx"

      - name: Integration Tests
        run: |
          mkdir -p artifacts/coverage && echo integration >> artifacts/coverage/expected.txt
          dotnet test LiteBus.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory artifacts/coverage/integration --filter "FullyQualifiedName~IntegrationTests&Category!=TransportFast&Category!=TransportDocker&Category!=TransportAzure&Category!=TransportLiveAzure"

      - name: Check Coverage Reports
        id: coverage-reports
        if: always()
        run: |
          # Each test step appends its results directory to expected.txt before it runs, so a step that
          # never started is not expected and a step that ran without producing a report fails here.
          coverage_count="$(find artifacts/coverage -type f -name 'coverage.cobertura.xml' | wc -l)"
          echo "count=${coverage_count}" >> "$GITHUB_OUTPUT"
          if [ "${coverage_count}" -eq 0 ]; then
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "::error::No Cobertura coverage reports were found in artifacts/coverage."
            exit 1
          fi
          echo "has_reports=true" >> "$GITHUB_OUTPUT"
          missing=0
          if [ -f artifacts/coverage/expected.txt ]; then
            while read -r name; do
              [ -z "${name}" ] && continue
              if [ -z "$(find "artifacts/coverage/${name}" -type f -name 'coverage.cobertura.xml' 2>/dev/null | head -n 1)" ]; then
                echo "::error::The ${name} test step produced no coverage.cobertura.xml in artifacts/coverage/${name}."
                missing=1
              fi
            done < artifacts/coverage/expected.txt
          fi
          exit "${missing}"

      - name: Coverage Report Summary
        if: always()
        run: |
          {
            echo "## Coverage report status"
            if [ "${{ steps.coverage-reports.outputs.has_reports }}" = "true" ]; then
              echo "- Found ${{ steps.coverage-reports.outputs.count }} Cobertura coverage report(s)."
              echo "- Coverage gate and upload steps will run."
            else
              echo "- No Cobertura coverage reports were found."
              echo "- Coverage gate and upload steps were skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Merged Coverage Gate
        shell: pwsh
        run: ./scripts/Test-CoverageThreshold.ps1 -Root artifacts/coverage -LineThreshold 90

      - name: Pack Packages
        shell: pwsh
        run: ./scripts/Pack-Packages.ps1 -OutputDirectory artifacts -Configuration Release -Version ${{ env.CI_PACKAGE_VERSION }} -NoBuild -NoRestore

      - name: Validate Packages
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -PackageDirectory artifacts -ExpectedVersion ${{ env.CI_PACKAGE_VERSION }}

      - name: Upload Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload Coverage Reports
        if: steps.coverage-reports.outputs.has_reports == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: artifacts/coverage/**/coverage.*

      - name: Upload Coverage to Codecov
        if: steps.coverage-reports.outputs.has_reports == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ./artifacts/coverage/**/coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
