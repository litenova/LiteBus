# Release - publish a tag whose commit already passed CI.
#
# The release does not rerun the gates. CI (ci.yml) runs every gate on each push to main and to version branches;
# pushing a v* tag runs this workflow, which checks the tag and changelog, requires a successful CI push or dispatch
# run on the exact tagged commit (waiting for one that is still running), then builds the signed packages at the
# tag's version and publishes them. Push the branch, let CI finish or keep running, then push the tag.
#
# A pre-release tag such as v7.0.0-preview.1 publishes like a stable tag. Its version suffix is what makes NuGet
# treat the package as a pre-release, and the GitHub release is marked as one so it does not displace the latest
# stable release.
#
# Notes come from the Changelog. The first preview and every stable release publish the version's own section, so
# each describes the whole line. A later preview publishes its own '## <tag>' section instead, which is a delta
# against the preview before it.
#
# A pre-release may be cut from any branch, so a version line can ship previews from its own branch and merge to
# main once it is stable. A stable tag must be on main: it is what NuGet resolves without an opt-in and what the
# documentation site deploys from.
name: Release

permissions:
  contents: read

# Two tag pushes close together must not publish at the same time, and a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    tags: [ 'v*' ]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      changelog_heading: ${{ steps.version.outputs.changelog_heading }}
      changelog_scope: ${{ steps.version.outputs.changelog_scope }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The branch policy below compares the tag against main, which a tag checkout does not fetch on its own.
          ref: ${{ github.ref }}

      - name: Validate Release Tag and Changelog
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${tag}' is not a supported semantic version tag."
            exit 1
          fi

          version="${tag#v}"
          base_tag="v${version%%-*}"

          if [ "${base_tag}" = "${tag}" ]; then
            prerelease=false
          else
            prerelease=true
          fi

          # A section for the tag itself wins, and for a pre-release after the first that is what makes its notes a
          # delta against the preview before it. Falling back to the version's own section is what the first preview
          # and every stable release read, so those publish the whole line.
          if grep -Fxq "## ${tag}" Changelog.md; then
            changelog_heading="## ${tag}"
            changelog_scope="delta"
          elif [ "${prerelease}" = "true" ] && [[ "${tag}" =~ \.([0-9]+)$ ]] && [ "${BASH_REMATCH[1]}" -gt 1 ]; then
            echo "::error::Changelog.md has no '## ${tag}' section. Every pre-release after the first of its line needs a delta section; see AGENTS.md, Releases and changelog."
            exit 1
          elif [ "${prerelease}" = "true" ] && grep -Fxq "## ${base_tag}" Changelog.md; then
            changelog_heading="## ${base_tag}"
            changelog_scope="cumulative"
          elif [ "${prerelease}" = "true" ]; then
            echo "::error::Changelog.md contains neither a '## ${tag}' nor a '## ${base_tag}' release heading."
            exit 1
          else
            echo "::error::Changelog.md does not contain an exact '## ${tag}' release heading."
            exit 1
          fi

          # A stable release always describes the whole version, whichever heading it read.
          if [ "${prerelease}" != "true" ]; then
            changelog_scope="cumulative"
          fi

          echo "Using tag version: ${version} (pre-release: ${prerelease}, ${changelog_scope} notes from ${changelog_heading})"
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "changelog_heading=${changelog_heading}"
            echo "changelog_scope=${changelog_scope}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate Release Branch
        env:
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"

          # Every remote branch the tagged commit is reachable from, for the run summary.
          branches="$(git branch --remotes --contains "${tag_sha}" --format="%(refname:lstrip=3)" \
            | grep -v '^HEAD$' | sort | paste -sd ',' - | sed 's/,/, /g')"
          branches="${branches:-none}"

          if git merge-base --is-ancestor "${tag_sha}" origin/main; then
            on_main=true
          else
            on_main=false
          fi

          if [ "${IS_PRERELEASE}" != "true" ] && [ "${on_main}" != "true" ]; then
            echo "::error::Stable tag '${GITHUB_REF_NAME}' is not reachable from main (found on: ${branches}). Merge the release line to main and tag the merge commit, or cut a pre-release tag instead."
            exit 1
          fi

          {
            echo "## Release source"
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${tag_sha}\`"
            echo "- Pre-release: ${IS_PRERELEASE}"
            echo "- Branches containing the tagged commit: ${branches}"
            echo "- Reachable from main: ${on_main}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Require Green CI on the Tagged Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release publishes what CI proved, so it needs a successful push or dispatch run of ci.yml on this
          # exact commit. Pull request runs do not count: they may skip as duplicates of the push run.
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          deadline=$(( $(date +%s) + 45 * 60 ))
          while true; do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${tag_sha}&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]')"
            if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<< "${runs}")" -gt 0 ]; then
              url="$(jq -r '[.[] | select(.conclusion == "success")][0].html_url' <<< "${runs}")"
              echo "CI passed on ${tag_sha}: ${url}"
              echo "- CI run: ${url}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            pending="$(jq '[.[] | select(.status != "completed")] | length' <<< "${runs}")"
            total="$(jq 'length' <<< "${runs}")"
            if [ "${total}" -gt 0 ] && [ "${pending}" -eq 0 ]; then
              echo "::error::CI did not succeed on ${tag_sha}. Fix the failure, push the fix, and tag the new commit."
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              if [ "${total}" -eq 0 ]; then
                echo "::error::No CI push run exists for ${tag_sha}. Push the commit to main or a version branch, or run CI on it with workflow_dispatch, then rerun this release."
              else
                echo "::error::CI on ${tag_sha} is still running after 45 minutes. Rerun this release once it finishes."
              fi
              exit 1
            fi
            echo "Waiting for CI on ${tag_sha} (${pending} running of ${total})."
            sleep 30
          done

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # NuGet trusted publishing: the job exchanges a GitHub OIDC token for a short-lived nuget.org API key.
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore LiteBus.slnx --locked-mode

      - name: Decode Strong Name Key
        uses: ./.github/actions/strong-name-key
        with:
          key: ${{ secrets.STRONG_NAME_KEY }}
          required: 'true'

      - name: Build
        run: dotnet build LiteBus.slnx --configuration Release --no-restore /p:Version=${{ needs.verify.outputs.version }} /p:ContinuousIntegrationBuild=true

      - name: Pack Packages
        shell: pwsh
        run: ./scripts/Pack-Packages.ps1 -OutputDirectory artifacts -Configuration Release -Version ${{ needs.verify.outputs.version }} -NoBuild -NoRestore

      - name: Validate Packages
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -PackageDirectory artifacts -ExpectedVersion ${{ needs.verify.outputs.version }}

      - name: Generate Release Notes
        env:
          CHANGELOG_HEADING: ${{ needs.verify.outputs.changelog_heading }}
          CHANGELOG_SCOPE: ${{ needs.verify.outputs.changelog_scope }}
          IS_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Upload Packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Log in to NuGet
        # Trusted publishing: the nuget.org policy for lite_nova allows release.yml in litenova/LiteBus to push
        # LiteBus* packages, so no long-lived API key is stored in the repository.
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: lite_nova

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "${package}" --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Publish to GitHub Packages
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "${package}" --api-key "${GH_PACKAGES_TOKEN}" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --skip-duplicate
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          # A pre-release must not become the release GitHub offers as latest, and a stable tag must.
          if [ "${IS_PRERELEASE}" = "true" ]; then
            release_kind=(--prerelease)
          else
            release_kind=(--latest)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            "${release_kind[@]}" \
            --notes-file release-notes.md
