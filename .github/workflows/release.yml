# Release - tag-triggered validation and publication
#
# Emulator-backed transport categories are mandatory and reject skipped tests. TransportLiveAzure remains an opt-in
# credential-backed category and is excluded from this release job.
#
# A pre-release tag such as v7.0.0-preview.1 runs every gate a stable tag runs. Its version suffix is what makes
# NuGet treat the package as a pre-release, and the GitHub release is marked as one so it does not displace the
# latest stable release. Its notes come from the Changelog section for the version it previews, because splitting
# one release's notes across its previews leaves no single section describing what shipped.
#
# A pre-release may be cut from any branch, so a version line can ship previews from its own branch and merge to
# main once it is stable. A stable tag must be on main: it is what NuGet resolves without an opt-in and what the
# documentation site deploys from, so shipping one from a branch would publish as generally available something
# that never passed through the default branch.
name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The branch policy below compares the tag against main, which a tag checkout does not fetch on its own.
          ref: ${{ github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Validate Documentation
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1

      - name: Validate Documentation Site
        working-directory: site
        run: |
          npm ci
          if ! npm audit --audit-level=high; then
            echo "::warning::npm audit (high) reported vulnerabilities. Continuing CI because documentation dependencies are best-effort validated here."
          fi
          npm run lint
          npm run typecheck
          npm run build

      - name: Validate Release Tag and Changelog
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${tag}' is not a supported semantic version tag."
            exit 1
          fi

          version="${tag#v}"
          base_tag="v${version%%-*}"

          if [ "${base_tag}" = "${tag}" ]; then
            prerelease=false
          else
            prerelease=true
          fi

          # A pre-release reads the section for the version it previews, so every preview of one release publishes
          # the same accumulated notes rather than a fragment of them.
          if grep -Fxq "## ${tag}" Changelog.md; then
            changelog_heading="## ${tag}"
          elif [ "${prerelease}" = "true" ] && grep -Fxq "## ${base_tag}" Changelog.md; then
            changelog_heading="## ${base_tag}"
          elif [ "${prerelease}" = "true" ]; then
            echo "::error::Changelog.md contains neither a '## ${tag}' nor a '## ${base_tag}' release heading."
            exit 1
          else
            echo "::error::Changelog.md does not contain an exact '## ${tag}' release heading."
            exit 1
          fi

          echo "Using tag version: ${version} (pre-release: ${prerelease}, notes from ${changelog_heading})"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "changelog_heading=${changelog_heading}" >> "${GITHUB_OUTPUT}"

      - name: Validate Release Branch
        id: branch
        env:
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"

          # Every remote branch the tagged commit is reachable from, for the run summary. A pre-release cut from a
          # version branch reports that branch; the list is empty for a tag on a commit no branch points past.
          branches="$(git branch --remotes --contains "${tag_sha}" --format="%(refname:lstrip=3)" \
            | grep -v '^HEAD$' | sort | paste -sd ',' - | sed 's/,/, /g')"
          branches="${branches:-none}"

          if git merge-base --is-ancestor "${tag_sha}" origin/main; then
            on_main=true
          else
            on_main=false
          fi

          if [ "${IS_PRERELEASE}" != "true" ] && [ "${on_main}" != "true" ]; then
            echo "::error::Stable tag '${GITHUB_REF_NAME}' is not reachable from main (found on: ${branches}). Merge the release line to main and tag the merge commit, or cut a pre-release tag instead."
            exit 1
          fi

          echo "Tagged commit ${tag_sha} is on: ${branches} (reachable from main: ${on_main})"
          echo "branches=${branches}" >> "${GITHUB_OUTPUT}"
          echo "on_main=${on_main}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Release source"
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Pre-release: ${IS_PRERELEASE}"
            echo "- Branches containing the tagged commit: ${branches}"
            echo "- Reachable from main: ${on_main}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Restore
        run: dotnet restore LiteBus.slnx --locked-mode

      - name: Audit NuGet Dependencies
        shell: bash
        run: |
          audit_output="$(dotnet list LiteBus.slnx package --vulnerable --include-transitive)"
          printf '%s\n' "${audit_output}"
          if grep -qi "has the following vulnerable packages" <<< "${audit_output}"; then
            echo "::error::NuGet vulnerability audit found a vulnerable package."
            exit 1
          fi

      - name: Decode Strong Name Key
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
        run: |
          if [ -z "${STRONG_NAME_KEY}" ]; then
            echo "::error::STRONG_NAME_KEY is required for release builds."
            exit 1
          fi
          echo "${STRONG_NAME_KEY}" | base64 --decode > LiteBus.snk

      - name: Build
        run: dotnet build LiteBus.slnx --configuration Release --no-restore /p:Version=${{ steps.version.outputs.version }} /p:ContinuousIntegrationBuild=true

      - name: Validate Documentation Semantics
        shell: pwsh
        run: ./scripts/Test-DocumentationSemantics.ps1 -Configuration Release

      - name: Verify Benchmark Discovery
        run: dotnet run --project benchmarks/LiteBus.Processor.Benchmarks --configuration Release --no-build -- --list flat

      - name: Fail on [Fact(Skip = ...)] in test projects
        run: bash .github/scripts/verify-no-fact-skips.sh "${{ github.workspace }}"

      - name: Require Docker for integration suites
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is required for release integration tests."
            exit 1
          fi
          echo "Docker is available."

      - name: Unit Tests
        run: dotnet test LiteBus.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory artifacts/coverage/unit --filter "FullyQualifiedName!~IntegrationTests"

      - name: Transport Fast Integration Tests
        run: dotnet test tests/LiteBus.Durable.IntegrationTests --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory artifacts/coverage/transport-fast --filter "Category=TransportFast"

      - name: Transport Docker Integration Tests
        env:
          LITEBUS_CI_STRICT_TRANSPORT: 'true'
        run: |
          trx_dir="${RUNNER_TEMP}/transport-docker"
          mkdir -p "${trx_dir}"
          dotnet test tests/LiteBus.Durable.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage/transport-docker-durable \
            --filter "Category=TransportDocker" \
            --logger "trx;LogFileName=${trx_dir}/durable-transport-docker.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/durable-transport-docker.trx"
          dotnet test tests/LiteBus.Transport.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage/transport-docker-wire \
            --filter "Category=TransportDocker" \
            --logger "trx;LogFileName=${trx_dir}/transport-wire-docker.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/transport-wire-docker.trx"

      - name: Transport Azure Integration Tests
        env:
          LITEBUS_CI_STRICT_TRANSPORT: 'true'
        run: |
          trx_dir="${RUNNER_TEMP}/transport-azure"
          mkdir -p "${trx_dir}"
          dotnet test tests/LiteBus.Durable.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage/transport-azure \
            --filter "Category=TransportAzure" \
            --logger "trx;LogFileName=${trx_dir}/transport-azure.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/transport-azure.trx"

      - name: Integration Tests
        run: dotnet test LiteBus.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory artifacts/coverage/integration --filter "FullyQualifiedName~IntegrationTests&Category!=TransportFast&Category!=TransportDocker&Category!=TransportAzure&Category!=TransportLiveAzure"

      - name: Check Coverage Reports
        id: coverage-reports
        if: always()
        run: |
          coverage_count="$(find artifacts/coverage -type f -name 'coverage.cobertura.xml' | wc -l)"
          echo "count=${coverage_count}" >> "$GITHUB_OUTPUT"
          if [ "${coverage_count}" -gt 0 ]; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Cobertura coverage reports were found in artifacts/coverage. Coverage upload step will be skipped."
          fi

      - name: Coverage Report Summary
        if: always()
        run: |
          {
            echo "## Coverage report status"
            if [ "${{ steps.coverage-reports.outputs.has_reports }}" = "true" ]; then
              echo "- Found ${{ steps.coverage-reports.outputs.count }} Cobertura coverage report(s)."
              echo "- Coverage gate and upload steps will run."
            else
              echo "- No Cobertura coverage reports were found."
              echo "- Coverage gate and upload steps were skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Merged Coverage Gate
        if: steps.coverage-reports.outputs.has_reports == 'true'
        shell: pwsh
        run: ./scripts/Test-CoverageThreshold.ps1 -Root artifacts/coverage -LineThreshold 90

      - name: Upload to Codecov
        if: steps.coverage-reports.outputs.has_reports == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: ./artifacts/coverage/**/coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Pack Packages
        shell: pwsh
        run: ./scripts/Pack-Packages.ps1 -OutputDirectory artifacts -Configuration Release -Version ${{ steps.version.outputs.version }} -NoBuild -NoRestore

      - name: Validate Packages
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -PackageDirectory artifacts -ExpectedVersion ${{ steps.version.outputs.version }}

      - name: Generate Release Notes
        env:
          CHANGELOG_HEADING: ${{ steps.version.outputs.changelog_heading }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Publish to NuGet
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "${package}" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          done

      - name: Publish to GitHub Packages
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "${package}" --api-key "${{ secrets.GITHUB_TOKEN }}" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A pre-release must not become the release GitHub offers as latest, and a stable tag must.
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            release_kind=(--prerelease)
          else
            release_kind=(--latest)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            ./artifacts/*.nupkg \
            ./artifacts/*.snupkg \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            "${release_kind[@]}" \
            --notes-file release-notes.md
