name: Manual Test and Coverage

permissions:
  contents: read

on:
  # This allows the workflow to be triggered manually from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  test-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore Dependencies
        run: dotnet restore LiteBus.slnx

      - name: Decode Strong Name Key
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
        run: |
          if [ -z "${STRONG_NAME_KEY}" ]; then
            echo "::error::STRONG_NAME_KEY is required for the manual release-equivalent test run."
            exit 1
          fi
          echo "${STRONG_NAME_KEY}" | base64 --decode > LiteBus.snk

      - name: Docker Info
        run: docker info

      - name: Run Tests and Generate Coverage
        shell: pwsh
        run: ./scripts/run-coverage.ps1 -ResultsDirectory ./coverage -SkipReport -EnforceThreshold

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          verbose: true
