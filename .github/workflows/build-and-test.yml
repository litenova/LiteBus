# Build & Test - mandatory CI gates for v6 GA
#
# Skip waiver policy:
#   - [Fact(Skip = ...)] is blocked by verify-no-fact-skips.sh on all branches except quarantine.
#   - Quarantine branch waives the gate until every hard-coded Fact skip is removed.
#   - Emulator-backed SkippableFact broker tests must not skip when Docker is available: TransportDocker and
#     TransportAzure set LITEBUS_CI_STRICT_TRANSPORT=true and verify TRX skipped counts. TransportLiveAzure is an
#     opt-in category that requires explicit cloud credentials.
#   - Full integration (PostgreSQL, AMQP, EF) requires Docker on ubuntu-latest runners.
name: Build & Test

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_PACKAGE_VERSION: 6.0.0-ci.${{ github.run_number }}

on:
  push:
    branches: [ '**' ]
    paths:
      - 'LiteBus.slnx'
      - 'Changelog.md'
      - 'README.md'
      - 'assets/**'
      - 'benchmarks/**'
      - 'coverlet*.runsettings'
      - 'docs/**'
      - 'global.json'
      - 'GitVersion.yml'
      - 'samples/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'LiteBus.slnx'
      - 'Changelog.md'
      - 'README.md'
      - 'assets/**'
      - 'benchmarks/**'
      - 'coverlet*.runsettings'
      - 'docs/**'
      - 'global.json'
      - 'GitVersion.yml'
      - 'samples/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Important for GitVersion

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Validate Documentation
        shell: pwsh
        run: ./scripts/Test-Documentation.ps1

      - name: Restore Dependencies
        run: dotnet restore LiteBus.slnx

      - name: Decode Strong Name Key
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
        run: |
          if [ -n "${STRONG_NAME_KEY}" ]; then
            echo "${STRONG_NAME_KEY}" | base64 --decode > LiteBus.snk
          fi

      - name: Build
        run: dotnet build LiteBus.slnx --configuration Release --no-restore /p:Version=${{ env.CI_PACKAGE_VERSION }} /p:ContinuousIntegrationBuild=true

      - name: Verify Benchmark Discovery
        run: dotnet run --project benchmarks/LiteBus.Processor.Benchmarks --configuration Release --no-build -- --list flat

      - name: Fail on [Fact(Skip = ...)] in test projects
        run: bash .github/scripts/verify-no-fact-skips.sh "${{ github.workspace }}"

      - name: Require Docker for integration suites
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is required for TransportDocker, TransportAzure, and full integration tests on CI."
            exit 1
          fi
          echo "Docker is available."

      - name: Unit Tests
        run: dotnet test LiteBus.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~IntegrationTests"

      - name: Transport Fast Integration Tests
        run: dotnet test tests/LiteBus.Durable.IntegrationTests --no-build --configuration Release --verbosity normal --filter "Category=TransportFast"

      - name: Transport Docker Integration Tests
        env:
          LITEBUS_CI_STRICT_TRANSPORT: 'true'
        run: |
          trx_dir="${RUNNER_TEMP}/transport-docker"
          mkdir -p "${trx_dir}"
          dotnet test tests/LiteBus.Durable.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --filter "Category=TransportDocker" \
            --logger "trx;LogFileName=${trx_dir}/durable-transport-docker.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/durable-transport-docker.trx"
          dotnet test tests/LiteBus.Transport.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --filter "Category=TransportDocker" \
            --logger "trx;LogFileName=${trx_dir}/transport-wire-docker.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/transport-wire-docker.trx"

      - name: Transport Azure Integration Tests
        env:
          LITEBUS_CI_STRICT_TRANSPORT: 'true'
        run: |
          trx_dir="${RUNNER_TEMP}/transport-azure"
          mkdir -p "${trx_dir}"
          dotnet test tests/LiteBus.Durable.IntegrationTests \
            --no-build --configuration Release --verbosity normal \
            --filter "Category=TransportAzure" \
            --logger "trx;LogFileName=${trx_dir}/transport-azure.trx"
          bash .github/scripts/verify-no-skipped-tests.sh "${trx_dir}/transport-azure.trx"

      - name: Integration Tests
        run: dotnet test LiteBus.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --filter "FullyQualifiedName~IntegrationTests&Category!=TransportFast&Category!=TransportDocker&Category!=TransportAzure&Category!=TransportLiveAzure"

      - name: Pack Packages
        shell: pwsh
        run: ./scripts/Pack-Packages.ps1 -OutputDirectory artifacts -Configuration Release -Version ${{ env.CI_PACKAGE_VERSION }} -NoBuild -NoRestore

      - name: Validate Packages
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -PackageDirectory artifacts -ExpectedVersion ${{ env.CI_PACKAGE_VERSION }}

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/**/*.xml'

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
