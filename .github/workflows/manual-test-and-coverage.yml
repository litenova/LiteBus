name: Manual Test and Coverage

permissions:
  contents: read

on:
  # This allows the workflow to be triggered manually from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  test-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore Dependencies
        run: dotnet restore LiteBus.slnx

      - name: Decode Strong Name Key
        env:
          STRONG_NAME_KEY: ${{ secrets.STRONG_NAME_KEY }}
        run: |
          if [ -z "${STRONG_NAME_KEY}" ]; then
            echo "::error::STRONG_NAME_KEY is required for the manual release-equivalent test run."
            exit 1
          fi
          echo "${STRONG_NAME_KEY}" | base64 --decode > LiteBus.snk

      - name: Docker Info
        run: docker info

      - name: Run Tests and Generate Coverage
        shell: pwsh
        run: ./scripts/run-coverage.ps1 -ResultsDirectory ./coverage -SkipReport -EnforceThreshold

      - name: Check Coverage Reports
        id: coverage-reports
        if: always()
        run: |
          coverage_count="$(find ./coverage -type f -name 'coverage.cobertura.xml' | wc -l)"
          echo "count=${coverage_count}" >> "$GITHUB_OUTPUT"
          if [ "${coverage_count}" -gt 0 ]; then
            echo "has_reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_reports=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Cobertura coverage reports were found in ./coverage. Codecov upload will be skipped."
          fi

      - name: Coverage Report Summary
        if: always()
        run: |
          {
            echo "## Coverage report status"
            if [ "${{ steps.coverage-reports.outputs.has_reports }}" = "true" ]; then
              echo "- Found ${{ steps.coverage-reports.outputs.count }} Cobertura coverage report(s)."
              echo "- Codecov upload step will run."
            else
              echo "- No Cobertura coverage reports were found."
              echo "- Codecov upload step was skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage to Codecov
        if: steps.coverage-reports.outputs.has_reports == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/**/coverage.cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: full-suite
          fail_ci_if_error: true
          verbose: true
